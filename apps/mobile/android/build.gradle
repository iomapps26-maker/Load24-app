buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "1.9.25"
        // npm workspaces monorepo: react-native is hoisted to the workspace root's
        // node_modules, not apps/mobile/node_modules. Individual native modules
        // (react-native-gesture-handler, etc.) each do their own react-native lookup
        // and fall back to this rootProject.ext property when their own relative-path
        // guesses miss — see the matching notes in app/build.gradle and settings.gradle.
        REACT_NATIVE_NODE_MODULES_DIR = "$rootDir/../../../node_modules/react-native"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
