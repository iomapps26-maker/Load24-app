// This is an npm workspaces monorepo (repo root has "workspaces": ["apps/*", ...]),
// so these packages are hoisted to the workspace root's node_modules rather than
// apps/mobile/node_modules — hence 3 levels up (android -> mobile -> apps -> root)
// instead of the single-app-repo default of 1.
pluginManagement { includeBuild("../../../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'LOAD24'
include ':app'
includeBuild('../../../node_modules/@react-native/gradle-plugin')
